seed: 0

models:
  - name: gpt2-small
    revision: 607a30d783dfa663caf39e06633721c8d4cfcd7e
    prepend_bos: true
    device: auto
    dtype: auto
    batch_size: 16
  - name: qwen-0.6b
    revision: da87bfb608c14b7cf20ba1ce41287e8de496c0cd
    prepend_bos: false
    device: auto
    dtype: auto
    batch_size: 8
  - name: gemma-2b
    revision: null  # Pin an immutable model commit before a reportable run.
    prepend_bos: true
    device: auto
    dtype: auto
    batch_size: 4
  - name: pythia-1.4b
    revision: null  # Pin an immutable model commit before a reportable run.
    prepend_bos: true
    device: auto
    dtype: auto
    batch_size: 8

data:
  repo_id: kokolamba/sentiment-manifold-ait-valence-binary
  revision: c53df7c117c2f433df904cfaeddb9062027f755f
  matched_config: common_matched_pairs
  train_split: train
  eval_split: validation
  test_split: test
  hf_token_env: HF_TOKEN
  positive_answers: [" Positive"]
  negative_answers: [" Negative"]

sampling:
  train_examples: 55
  eval_directed_cases: 30
  test_directed_cases: 30

sweep:
  layers: all_non_embedding
  methods: [mean_diff, logistic_regression, das]
  # Override from the CLI with --mean-pool or --last-token.
  activation_representation: mean_pool
  output_dir: outputs/ait-valence-directions
  checkpoint_dir: checkpoints/ait-valence-directions
  resume: true
  include_special_tokens_in_mean_pool: false

selection:
  # Eval is used only to select the DAS epoch at each layer.
  das_checkpoint_split: eval
  das_checkpoint_metric: validation_loss
  # Test is a disjoint layer-selection set, not an unbiased final evaluation.
  layer_selection_split: test
  layer_selection_metric: logit_flip_percent

fitting:
  logistic_c: 1.0
  logistic_solver: liblinear
  logistic_max_iter: 1000
  logistic_tol: 0.0001

das:
  epochs: 64
  learning_rate: 0.001
  weight_decay: 0.0
  batch_size: 8
  max_grad_norm: 1.0
  implementation: tigges_rotation
