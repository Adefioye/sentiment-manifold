seed: 0

model:
  name: gpt2-small
  revision: null
  device: auto
  dtype: auto
  batch_size: 16

data:
  toy_config: data/toy_movie_review.yaml
  sst_root: ../eliciting-latent-sentiment/stanfordSentimentTreebank
  sst_split: dev
  sst_max_examples: null
  sst_max_pairs: 128
  openwebtext_dataset: stas/openwebtext-10k
  openwebtext_split: train
  openwebtext_max_samples: 128
  openwebtext_sequence_length: 128
  openwebtext_random_seeds: [1, 2, 3, 4]

experiment:
  layers: all
  methods: [mean_diff, kmeans, logistic_regression, pca, das]
  selection_metric: sst_patch_recovery
  evaluate_openwebtext: false
  output_dir: outputs
  resume: true

das:
  epochs: 32
  learning_rate: 0.001
  weight_decay: 0.0
  batch_size: 16
  max_grad_norm: 1.0
