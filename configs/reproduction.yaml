seed: 0

model:
  name: gpt2-small
  revision: 607a30d783dfa663caf39e06633721c8d4cfcd7e
  prepend_bos: true
  device: auto
  dtype: auto
  batch_size: 16

data:
  toy_config: data/toy_movie_review.yaml
  sst_root: ../eliciting-latent-sentiment/stanfordSentimentTreebank
  sst_processed_dir: data/processed/sst-pythia-1.4b
  sst_dataset_config: tigges_pythia_correct
  sst_split: test
  sst_max_examples: null
  sst_max_pairs: null
  openwebtext_dataset: stas/openwebtext-10k
  openwebtext_split: train
  openwebtext_max_samples: 128
  openwebtext_sequence_length: 128
  openwebtext_random_seeds: [1, 2, 3, 4]

experiment:
  layers: all
  methods: [mean_diff, kmeans, logistic_regression, pca, das, das2d, das3d, random]
  openwebtext_resample_ablation: false
  output_dir: outputs/results
  checkpoint_dir: checkpoints
  resume: true

fitting:
  kmeans_n_init: 10
  logistic_c: 1.0
  logistic_solver: liblinear
  logistic_max_iter: 1000
  logistic_tol: 0.0001

das:
  epochs: 64
  learning_rate: 0.001
  weight_decay: 0.0
  batch_size: 128
  max_grad_norm: 1.0
  implementation: tigges_rotation
