epochs: 64
learning_rate: 0.001
weight_decay: 0.0
batch_size: 16
max_grad_norm: 1.0

# Cross-entropy is used for both real and random tasks because random labels do
# not provide a trustworthy clean/corrupted recovery denominator.
objective: answer_cross_entropy
intervention_position: final
checkpoint_metric: validation_loss

# Explicit one-parameter sweep: learning rate varies while every other DAS
# training choice remains fixed. Values are approximately log-spaced and keep
# the reference 0.001 setting.
trials:
  - {learning_rate: 0.0001, weight_decay: 0.0, epochs: 64}
  - {learning_rate: 0.0002, weight_decay: 0.0, epochs: 64}
  - {learning_rate: 0.0003, weight_decay: 0.0, epochs: 64}
  - {learning_rate: 0.0005, weight_decay: 0.0, epochs: 64}
  - {learning_rate: 0.0007, weight_decay: 0.0, epochs: 64}
  - {learning_rate: 0.001, weight_decay: 0.0, epochs: 64}
  - {learning_rate: 0.002, weight_decay: 0.0, epochs: 64}
  - {learning_rate: 0.003, weight_decay: 0.0, epochs: 64}
  - {learning_rate: 0.005, weight_decay: 0.0, epochs: 64}
  - {learning_rate: 0.01, weight_decay: 0.0, epochs: 64}
