seed: 0

model:
  name: gpt2-small
  revision: 607a30d783dfa663caf39e06633721c8d4cfcd7e
  prepend_bos: true
  device: cpu
  dtype: float32
  batch_size: 16

data:
  toy_config: data/toy_movie_review.yaml
  sst_root: ../eliciting-latent-sentiment/stanfordSentimentTreebank
  sst_processed_dir: data/processed/sst-pythia-1.4b
  sst_dataset_config: tigges_pythia_correct
  sst_split: test
  sst_max_examples: 32
  sst_max_pairs: 2
  openwebtext_dataset: stas/openwebtext-10k
  openwebtext_split: train
  openwebtext_max_samples: 8
  openwebtext_sequence_length: 32
  openwebtext_random_seeds: [1]

experiment:
  layers: [0]
  methods: [mean_diff, kmeans, logistic_regression, pca, das]
  openwebtext_resample_ablation: false
  output_dir: outputs/smoke
  resume: true

das:
  epochs: 1
  learning_rate: 0.001
  weight_decay: 0.0
  batch_size: 16
  max_grad_norm: 1.0
  implementation: tigges_rotation
