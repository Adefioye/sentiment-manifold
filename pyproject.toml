[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sentiment-manifold"
version = "0.1.0"
description = "Reproducible sentiment-direction experiments for causal language-model analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "accelerate>=1.0",
  "datasets>=2.20",
  "huggingface-hub>=0.27",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
  "seaborn>=0.13",
  "torch>=2.2",
  "tqdm>=4.66",
  "transformers>=4.51,<5",
]

[project.optional-dependencies]
notebooks = ["ipykernel>=6.29", "jupyterlab>=4.2"]
dev = ["pytest>=8.2", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
sentiment-manifold = "sentiment_manifold.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentiment_manifold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
